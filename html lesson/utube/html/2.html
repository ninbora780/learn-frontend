<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table html</title>
    <style>
        table tr th td{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h2>HTML table</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>NAME</th>
            <th>GRADE</th>  
        </tr>
        <tr>
            <td>1</td>
            <td>nin bora</td>
            <td>A</td>
        </tr>
    </table>
</body>
</html>
