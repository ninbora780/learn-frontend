<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    a{
        font-size: 30px;
        color: blue;
        text-decoration: none;
        font-weight: bold;
        display: inline-block;
        transition: all 0.5s;
    }
    .kh{
        display: none;
    }
    a:hover .kh{
        color: blueviolet;
        display: block;
    }
    a:hover .eg {
        display: none;
    }
</style>
</head>
<body>
    <a href="">
        <span class="eg">Khmer Product</span>
        <span class="kh">ផលិតផលខ្មែរ</span>
    </a>
</body>
</html>
