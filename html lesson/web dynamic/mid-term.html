<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Year in khmer numbers</h1>
    <script>
        let d=new Date();
        let y=d.getFullYear().toString();
        let num=['០','១','២','៣','៤','៥','៦','៧','៨','៩'];
        let yNUM=num [y[0]]+num [y[1]]+num [y[2]]+num [y[3]];
        document.write("Current Year in Khmer: " + yNUM);
    </script>
</body>
</html>
