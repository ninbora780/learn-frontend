<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn-script.com/ajax/libs/jquery/3.7.1/jquery.js"></script>
    <script>
        $(()=>{
            $("#nametxt").keyup(()=>{
                // let data = $("#data").text();
                // let dataa = $("#data").html();
                let name = $("#nametxt").val();
                // alert ("Data : " + dataa);
                $(".result").html("Good morning <b>"+ name + "</b>");
            });
        });
    </script>
</head>
<body>
    <h1>jquery html manipulation</h1>
    <input type="text" id="nametxt" placeholder="enter name">
    <button>click me</button>
    <div id="data">Good morning <B>everyone</B></div>
    <p class="result">result will be here....</p>
</body>
</html>
