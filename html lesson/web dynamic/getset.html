<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get set </title>
    <script src="https://cdn-script.com/ajax/libs/jquery/3.7.1/jquery.js"></script>
    <script>
        $(()=>{
            $("button").click(function(){
                let cl = $(this).text();
                let newRow = "<tr><td>Borong";
                    newRow += "<td>008";
                    newRow += "<td>B";
                if(cl == "prepend")
                {
                    $("#tb tbody").prepend(newRow);
                }
                else
                {
                    $("#tb tbody").append(newRow);
                }
            });
        });
    </script>
</head>
<body>
    <h1>Jquery Append Table row</h1>
    <button>append</button>
    <button>prepend</button>
    <table id="tb" border="1" cellpadding = "9" cellspacing = "0" width="500">
        <thead>
            <tr>
                <th>name</th>
                <th>id</th>
                <th>grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Bora</td>
                <td>007</td>
                <td>A</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
