    <table>
        <tr>
            <td>ID</td>
            <td>Name</td>
            <td>Grade</td>
            <td>HTML</td>
            <td>CSS</td>
            <td>JS</td>

            <td>Total</td>
            <td>Average</td>
            <td>Grade</td>
        </tr>
        <script>
            let array = [
                ["p001" , "Sok pisey" , "Male" , 67 , 72 , 77 , 82],
                ["p002" , "Ratanak" , "Female" , 67 , 74 , 79 , 83],

                ["p006" , "Sita" , "Female" , 78 , 82 , 87 , 87],
                ["p007" , "GIGI" , "Male" , 78 , 84 , 89 , 88],
            ];
            for ( let i = 0 ; i <array.length ; i++)
            {
                document.write("<tr>")
                    for (let j = 0 ; j <7 ; j++)
                {
                    document.write("<td>" + array[i][j]);
                    
                }
                let total = 0;
                total = array[i][3]+array[i][4]+array[i][5]+array[i][6];
                let avg = total/4;
                let grade ;
                document.write("<td>" + total);
                document.write("<td>" + avg);
                if (avg>=90)grade ="A";
                else if (avg>=80)grade ="B";
                else if (avg>=70)grade ="C";
                else if (avg>=60)grade ="D";
                else if (avg>=50)grade ="E";
                else
                grade ="f";

                document.write("</tr>");
            }
