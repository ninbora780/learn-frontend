<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Homework about Multiplication</h1>
    <script>
      let d = document;
      for (let i = 2; i <= 7; i++) {
        for (let j = 1; j <= 10; j++) {
          d.write(i + " x " + j + " = " + i * j + "<br>");
        }
        d.write("<br>");
      }
    </script>
  </body>
</html>
