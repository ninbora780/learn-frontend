<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>keySet</title>
  <script src="https://cdn-script.com/ajax/libs/jquery/3.7.1/jquery.js"></script>
  <script>
    $(function(){
      $("body").on("keydown" , function(e){
        e.preventDefault();
        let k = e.key.toLowerCase();
        $('.' + k).addClass("add");
      });
    });
  </script>   

  <style>
    body{
      display: flex;
      height: 100vh;
      flex-direction: column;
      justify-content: center;
      align-items: center ;
    }
    h1{
      font-family: sans-serif;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 2.5rem;  
    }
    .container{
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      background-color:azure;
      width: 70%;
      height: 50%;
      outline: 5px solid rgb(241, 226, 250);
      border-radius: 10px;
      box-shadow: 10px 10px 7px rgb(73, 73, 73);
      align-items: center;
      justify-items: center;
    }
    .selector{
      background-color: rgb(84, 241, 84);
    }
    div{
      display: block;
      width: 50px;
      height: 40px;
      background-color:aqua;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      box-shadow: 2px 2px 3px rgb(53, 22, 110);
      padding: 10px;
      transition: all o.2s ease;
      font-size: 24px;
    }
    .backspace , .enter , .shift {
      grid-column: 11/13;
      display: block;
      width: 150px;
      text-align: center;
      height: 40px;
      display: flex;
      align-items: center;
    }
    .add{
      transform: scale(1.1);
      background-color: rgb(168, 235, 68);
      box-shadow: 2px 2px 3px rgb(157, 120, 226);
    }
  </style>
</head>
<body>
  <h1> Test Keys </h1>
  <section class="container">
  <div class="1">1</div>
  <div class="2">2</div>
  <div class="3">3</div>
  <div class="4">4</div>
  <div class="5">5</div>
  <div class="6">6</div>
  <div class="7">7</div>
  <div class="8">8</div>
  <div class="9">9</div>
  <div class="0">0</div>
  <div class="backspace">Backspace</div>
  <div class="q">Q</div>
  <div class="w">W</div>
  <div class="e">E</div>
  <div class="r">R</div>
  <div class="t">T</div>
  <div class="y">Y</div>
  <div class="u">U</div>
  <div class="i">I</div>
  <div class="o">O</div>
  <div class="p">P</div>
  <div class="enter">enter</div>
  <div class="a">A</div>
  <div class="s">S</div>
  <div class="d">D</div>
  <div class="f">F</div>
  <div class="g">G</div>
  <div class="h">H</div>  
  <div class="j">J</div>
  <div class="k">K</div>
  <div class="l">l</div>
  <div class="z">Z</div>
  <div class="shift">Shift</div>
  <div class="x">X</div>
  <div class="c">C</div>
  <div class="v">V</div>
  <div class="b">B</div>
  <div class="n">N</div>
  <div class="m">M</div>
  </section>
</body>
</html>
